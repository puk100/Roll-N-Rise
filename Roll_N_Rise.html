<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Climb</title>
<style>
  :root {
    --normal: #eef1f5;
    --red: #ff6b6b;
    --blue: #4dabf7;
    --yellow: #ffd43b;
    --green: #51cf66;
    --purple: #cc5de8;
    --finish: #212529;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #222;
    padding: 20px;
  }
  h1 {
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    margin-bottom: 4px;
  }
  .subtitle { color: #dbe4ff; margin-top:0; margin-bottom: 20px; font-size: 14px;}

  #setup {
    background: #fff;
    padding: 24px 30px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    text-align: center;
    max-width: 480px;
    width: 100%;
  }
  #setup label { display:block; margin: 10px 0 4px; font-weight:600; }
  #setup select {
    padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; font-size:14px; width: 100%;
  }
  #setup button, .btn {
    margin-top: 18px;
    padding: 10px 22px;
    background: #364fc7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #setup button:hover, .btn:hover { background: #4263eb; }

  .player-name-row {
    display:flex;
    gap:8px;
    align-items:center;
    margin-top:10px;
  }
  .player-name-row .color-swatch {
    width: 20px; height: 20px; border-radius:50%; flex: 0 0 auto;
    border: 2px solid rgba(0,0,0,0.1);
  }
  .player-name-row input[type="text"] {
    flex: 1 1 auto;
    min-width: 0;
    padding: 10px 12px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
  }
  .player-name-row input[type="text"]:focus {
    border-color: #4263eb;
    box-shadow: 0 0 0 3px rgba(66,99,235,0.2);
  }
  .player-name-row select.char-select {
    flex: 0 0 74px;
    padding: 8px 4px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #ccc;
    text-align: center;
  }

  #game { display:none; width:100%; max-width: 1000px; flex-direction: column; align-items:center; }

  .legend {
    display:flex; flex-wrap:wrap; gap: 12px; justify-content:center;
    background: rgba(255,255,255,0.9); padding: 10px 16px; border-radius: 10px; margin-bottom: 16px;
    font-size: 13px;
  }
  .legend div { display:flex; align-items:center; gap:6px; }
  .swatch { width:14px; height:14px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,0.15);}

  #board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
    background: rgba(255,255,255,0.15);
    padding: 10px;
    border-radius: 12px;
    width: 100%;
  }
  .tile {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 12px;
    color: #333;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.06);
  }
  .tile.normal { background: var(--normal); }
  .tile.red { background: var(--red); color:#fff; }
  .tile.blue { background: var(--blue); color:#fff; }
  .tile.yellow { background: var(--yellow); }
  .tile.green { background: var(--green); color:#fff; }
  .tile.purple { background: var(--purple); color:#fff; }
  .tile.finish { background: var(--finish); color:#fff; }
  .tile .num { position:absolute; top:2px; left:4px; font-size:10px; opacity:0.6; }

  .tokens { position:absolute; bottom:2px; display:flex; gap:2px; flex-wrap:wrap; justify-content:center; width:100%; }
  .token {
    font-size: 16px;
    line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    transition: transform 0.15s ease;
  }
  .token.hop {
    animation: hopBounce 0.22s ease;
  }
  @keyframes hopBounce {
    0% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-10px) scale(1.15); }
    100% { transform: translateY(0) scale(1); }
  }

  #controls {
    margin-top: 20px;
    background: #fff;
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 500px;
  }
  #turnInfo { font-size: 18px; font-weight: 600; text-align:center; }
  #turnInfo .color-dot { display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:6px; vertical-align:middle; }

  #dice {
    width: 60px; height: 60px;
    background: #fff;
    border: 3px solid #333;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: bold;
    margin: 6px 0;
  }
  #log {
    width: 100%;
    max-width: 500px;
    background: rgba(255,255,255,0.9);
    border-radius: 10px;
    margin-top: 16px;
    padding: 10px 14px;
    max-height: 140px;
    overflow-y: auto;
    font-size: 13px;
  }
  #log div { margin-bottom: 4px; }
  .hidden { display:none !important; }

  #winnerOverlay {
    position: fixed; inset:0; background: rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center; z-index: 10;
  }
  #winnerBox {
    background:#fff; padding: 40px 50px; border-radius: 16px; text-align:center;
  }
  #winnerBox h2 { margin-top:0; }

  #powerPopup {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-30px);
    background: #212529;
    color: #fff;
    padding: 14px 26px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    opacity: 0;
    z-index: 50;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    text-align: center;
    max-width: 90%;
  }
  #powerPopup.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<h1>🎲 Color Climb</h1>
<p class="subtitle">A simple race game — roll, climb, and dodge the colors!</p>

<div id="powerPopup"></div>

<div id="setup">
  <h2>Game Setup</h2>
  <label for="numPlayers">Number of Players</label>
  <select id="numPlayers">
    <option value="2">2 Players</option>
    <option value="3">3 Players</option>
    <option value="4">4 Players</option>
  </select>
  <div id="nameFields"></div>
  <button id="startBtn">Start Game</button>
</div>

<div id="game">
  <div class="legend">
    <div><span class="swatch" style="background:var(--normal)"></span> Normal</div>
    <div><span class="swatch" style="background:var(--red)"></span> Skip Turn</div>
    <div><span class="swatch" style="background:var(--blue)"></span> Boost +3</div>
    <div><span class="swatch" style="background:var(--yellow)"></span> Swap Places</div>
    <div><span class="swatch" style="background:var(--green)"></span> Slide -2</div>
    <div><span class="swatch" style="background:var(--purple)"></span> Roll Again</div>
    <div><span class="swatch" style="background:var(--finish)"></span> Finish</div>
  </div>

  <div id="board"></div>

  <div id="controls">
    <div id="turnInfo"></div>
    <div id="dice">?</div>
    <button class="btn" id="rollBtn">Roll Dice</button>
  </div>

  <div id="log"></div>
</div>

<script>
const PLAYER_COLORS = ['#e03131', '#1971c2', '#2f9e44', '#f08c00'];
const PLAYER_NAMES_DEFAULT = ['Player 1', 'Player 2', 'Player 3', 'Player 4'];
const CHARACTERS = ['🚀','🐯','🦊','🐸','🦁','🐼','🐧','🦄'];

const TILE_TYPES = ['normal','blue','normal','normal','normal','yellow','yellow','purple','normal','red',
'normal','normal','red','normal','normal','yellow','blue','normal','blue','green',
'normal','green','yellow','normal','normal','purple','normal','normal','normal','green',
'blue','green','yellow','blue','purple','normal','blue','green','blue','green',
'blue','yellow','normal','normal','normal','normal','normal','normal','normal','finish'];

const TOTAL_TILES = TILE_TYPES.length; // 50, indices 0-49

const POWER_INFO = {
  red:    { label: 'RED POWER', icon: '🔴', desc: p => `${p.name} will SKIP their next turn!` },
  blue:   { label: 'BLUE POWER', icon: '🔵', desc: p => `${p.name} BOOSTS forward 3 spaces!` },
  yellow: { label: 'YELLOW POWER', icon: '🟡', desc: (p, extra) => `${p.name} SWAPS places with ${extra}!` },
  green:  { label: 'GREEN POWER', icon: '🟢', desc: p => `${p.name} SLIDES back 2 spaces!` },
  purple: { label: 'PURPLE POWER', icon: '🟣', desc: p => `${p.name} ROLLS AGAIN!` }
};

let players = [];
let currentPlayerIndex = 0;
let gameOver = false;

const numPlayersSelect = document.getElementById('numPlayers');
const nameFields = document.getElementById('nameFields');
const startBtn = document.getElementById('startBtn');
const setupDiv = document.getElementById('setup');
const gameDiv = document.getElementById('game');
const boardDiv = document.getElementById('board');
const turnInfo = document.getElementById('turnInfo');
const diceDiv = document.getElementById('dice');
const rollBtn = document.getElementById('rollBtn');
const logDiv = document.getElementById('log');
const powerPopup = document.getElementById('powerPopup');

function renderNameFields() {
  const n = parseInt(numPlayersSelect.value);
  nameFields.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const row = document.createElement('div');
    row.className = 'player-name-row';
    row.innerHTML = `
      <span class="color-swatch" style="background:${PLAYER_COLORS[i]}"></span>
      <input type="text" id="pname${i}" placeholder="${PLAYER_NAMES_DEFAULT[i]}">
      <select class="char-select" id="pchar${i}">
        ${CHARACTERS.map(c => `<option value="${c}">${c}</option>`).join('')}
      </select>
    `;
    nameFields.appendChild(row);
    // give each player a different default character
    document.getElementById(`pchar${i}`).selectedIndex = i % CHARACTERS.length;
  }
}
numPlayersSelect.addEventListener('change', renderNameFields);
renderNameFields();

startBtn.addEventListener('click', () => {
  const n = parseInt(numPlayersSelect.value);
  players = [];
  for (let i = 0; i < n; i++) {
    const input = document.getElementById(`pname${i}`);
    const charSelect = document.getElementById(`pchar${i}`);
    const name = (input.value.trim()) || PLAYER_NAMES_DEFAULT[i];
    players.push({
      name,
      color: PLAYER_COLORS[i],
      character: charSelect.value,
      position: 0,
      skipNext: false
    });
  }
  currentPlayerIndex = 0;
  gameOver = false;
  setupDiv.style.display = 'none';
  gameDiv.style.display = 'flex';
  buildBoard();
  updateBoard();
  updateTurnInfo();
  logDiv.innerHTML = '';
  addLog('Game started! Good luck to all players.');
});

function buildBoard() {
  boardDiv.innerHTML = '';
  const cols = 10;
  const rows = Math.ceil(TOTAL_TILES / cols);
  let order = [];
  for (let r = 0; r < rows; r++) {
    let rowIndices = [];
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      if (idx < TOTAL_TILES) rowIndices.push(idx);
    }
    if (r % 2 === 1) rowIndices.reverse();
    order.push(...rowIndices);
  }
  order.forEach(idx => {
    const tile = document.createElement('div');
    tile.className = `tile ${TILE_TYPES[idx]}`;
    tile.id = `tile-${idx}`;
    tile.innerHTML = `<span class="num">${idx}</span><div class="tokens" id="tokens-${idx}"></div>`;
    boardDiv.appendChild(tile);
  });
}

function updateBoard(hopPlayer) {
  for (let i = 0; i < TOTAL_TILES; i++) {
    const t = document.getElementById(`tokens-${i}`);
    if (t) t.innerHTML = '';
  }
  players.forEach((p) => {
    const container = document.getElementById(`tokens-${p.position}`);
    if (container) {
      const tok = document.createElement('span');
      tok.className = 'token';
      tok.textContent = p.character;
      tok.title = p.name;
      if (hopPlayer === p) tok.classList.add('hop');
      container.appendChild(tok);
    }
  });
}

function updateTurnInfo() {
  if (gameOver) return;
  const p = players[currentPlayerIndex];
  turnInfo.innerHTML = `<span class="color-dot" style="background:${p.color}"></span>${p.character} ${p.name}'s turn (tile ${p.position})`;
}

function addLog(msg) {
  const div = document.createElement('div');
  div.textContent = msg;
  logDiv.prepend(div);
}

function showPowerPopup(text) {
  powerPopup.textContent = text;
  powerPopup.classList.add('show');
  clearTimeout(showPowerPopup._t);
  showPowerPopup._t = setTimeout(() => {
    powerPopup.classList.remove('show');
  }, 2200);
}

function nextPlayer() {
  currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  while (players[currentPlayerIndex].skipNext) {
    addLog(`${players[currentPlayerIndex].character} ${players[currentPlayerIndex].name} skips their turn!`);
    players[currentPlayerIndex].skipNext = false;
    currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  }
}

// Sleep helper
function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

// Move a player step-by-step, one tile at a time, from current position toward target.
// direction: +1 forward, -1 backward
async function stepMove(player, targetPos) {
  const dir = targetPos > player.position ? 1 : (targetPos < player.position ? -1 : 0);
  while (player.position !== targetPos) {
    player.position += dir;
    updateBoard(player);
    await sleep(220);
  }
}

async function applyTileEffect(player) {
  const tileType = TILE_TYPES[player.position];
  let rollAgain = false;

  switch (tileType) {
    case 'red': {
      player.skipNext = true;
      const info = POWER_INFO.red;
      addLog(`${player.character} ${player.name} landed on RED — will skip next turn!`);
      showPowerPopup(`${info.icon} ${info.label} — ${info.desc(player)}`);
      await sleep(300);
      break;
    }
    case 'blue': {
      const target = Math.min(player.position + 3, TOTAL_TILES - 1);
      const info = POWER_INFO.blue;
      showPowerPopup(`${info.icon} ${info.label} — ${info.desc(player)}`);
      await stepMove(player, target);
      addLog(`${player.character} ${player.name} landed on BLUE — boosted forward 3 to tile ${player.position}!`);
      await sleep(200);
      break;
    }
    case 'yellow': {
      const others = players.filter(p => p !== player);
      const swapWith = others[Math.floor(Math.random() * others.length)];
      const info = POWER_INFO.yellow;
      showPowerPopup(`${info.icon} ${info.label} — ${info.desc(player, swapWith.name)}`);
      const temp = player.position;
      player.position = swapWith.position;
      swapWith.position = temp;
      updateBoard(player);
      addLog(`${player.character} ${player.name} landed on YELLOW — swapped places with ${swapWith.character} ${swapWith.name}!`);
      await sleep(300);
      break;
    }
    case 'green': {
      const target = Math.max(player.position - 2, 0);
      const info = POWER_INFO.green;
      showPowerPopup(`${info.icon} ${info.label} — ${info.desc(player)}`);
      await stepMove(player, target);
      addLog(`${player.character} ${player.name} landed on GREEN — slid back 2 to tile ${player.position}!`);
      await sleep(200);
      break;
    }
    case 'purple': {
      const info = POWER_INFO.purple;
      addLog(`${player.character} ${player.name} landed on PURPLE — rolls again!`);
      showPowerPopup(`${info.icon} ${info.label} — ${info.desc(player)}`);
      rollAgain = true;
      await sleep(300);
      break;
    }
    case 'finish': {
      addLog(`🏆 ${player.character} ${player.name} reached the finish and WINS!`);
      showWinner(player);
      break;
    }
    default:
      break;
  }
  return rollAgain;
}

function showWinner(player) {
  gameOver = true;
  rollBtn.disabled = true;
  const overlay = document.createElement('div');
  overlay.id = 'winnerOverlay';
  overlay.innerHTML = `
    <div id="winnerBox">
      <h2 style="color:${player.color}">🏆 ${player.character} ${player.name} Wins!</h2>
      <p>Congratulations on reaching the finish line first.</p>
      <button class="btn" onclick="location.reload()">Play Again</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

rollBtn.addEventListener('click', () => {
  if (gameOver) return;
  rollBtn.disabled = true;
  const player = players[currentPlayerIndex];

  let rollCount = 0;
  const rollInterval = setInterval(() => {
    diceDiv.textContent = Math.ceil(Math.random() * 6);
    rollCount++;
    if (rollCount > 8) {
      clearInterval(rollInterval);
      const roll = Math.ceil(Math.random() * 6);
      diceDiv.textContent = roll;
      handleMove(player, roll);
    }
  }, 60);
});

async function handleMove(player, roll) {
  const target = Math.min(player.position + roll, TOTAL_TILES - 1);
  addLog(`${player.character} ${player.name} rolled a ${roll}.`);

  // Step-by-step hop from current tile to target tile, one tile at a time
  await stepMove(player, target);
  updateTurnInfo();

  if (player.position === TOTAL_TILES - 1 && TILE_TYPES[player.position] === 'finish') {
    await applyTileEffect(player);
    return;
  }

  const rollAgain = await applyTileEffect(player);
  updateBoard();
  updateTurnInfo();

  if (gameOver) return;

  if (rollAgain) {
    rollBtn.disabled = false;
    return;
  }

  nextPlayer();
  updateTurnInfo();
  rollBtn.disabled = false;
}
</script>
</body>
</html>
