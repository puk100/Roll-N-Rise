<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roll N Ride</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&display=swap');
  :root {
    --normal: #96a7ff;
    --red: #ff5d9e;
    --blue: #2ed3ff;
    --yellow: #ffd44d;
    --green: #40f0b2;
    --purple: #b37dff;
    --finish: #eff7ff;
    --panel: rgba(12, 18, 36, 0.72);
    --panel-strong: rgba(16, 24, 48, 0.82);
    --ink: #eaf8ff;
    --muted: #8bb3c9;
    --accent: #00d7ff;
    --accent-strong: #00a3d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Share Tech Mono', 'Orbitron', monospace;
    background:
      radial-gradient(circle at 16% 18%, rgba(61, 132, 255, 0.26), transparent 40%),
      radial-gradient(circle at 84% 14%, rgba(255, 61, 182, 0.22), transparent 38%),
      radial-gradient(circle at 78% 80%, rgba(0, 234, 255, 0.18), transparent 35%),
      linear-gradient(165deg, #050814 0%, #07132b 42%, #150d3a 72%, #191737 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--ink);
    padding: 24px 16px 32px;
    position: relative;
    overflow-x: hidden;
  }
  .color-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(28px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
    mix-blend-mode: screen;
    animation: drift 16s ease-in-out infinite;
  }
  .color-orb.a {
    width: 360px;
    height: 360px;
    left: -90px;
    top: -70px;
    background: radial-gradient(circle, rgba(255, 107, 214, 0.95), rgba(255, 107, 214, 0));
  }
  .color-orb.b {
    width: 420px;
    height: 420px;
    right: -120px;
    top: 18%;
    background: radial-gradient(circle, rgba(255, 196, 88, 0.9), rgba(255, 196, 88, 0));
    animation-delay: -5s;
    animation-duration: 20s;
  }
  .color-orb.c {
    width: 380px;
    height: 380px;
    left: 28%;
    bottom: -150px;
    background: radial-gradient(circle, rgba(73, 205, 255, 0.85), rgba(73, 205, 255, 0));
    animation-delay: -9s;
    animation-duration: 22s;
  }
  @keyframes drift {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    30% { transform: translate3d(32px, -22px, 0) scale(1.08); }
    60% { transform: translate3d(-18px, 28px, 0) scale(0.95); }
    100% { transform: translate3d(0, 0, 0) scale(1); }
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(60,170,255,0.14) 1px, transparent 1px),
      linear-gradient(90deg, rgba(42,164,255,0.12) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent 90%);
    opacity: 0.2;
    z-index: 0;
    animation: gridDrift 20s linear infinite;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.12), transparent 22%),
      radial-gradient(circle at 64% 36%, rgba(255, 255, 255, 0.1), transparent 18%),
      radial-gradient(circle at 48% 72%, rgba(255, 255, 255, 0.08), transparent 26%);
    filter: blur(2px);
    opacity: 0.55;
    z-index: 0;
    animation: starsPulse 7s ease-in-out infinite;
  }
  @keyframes gridDrift {
    from { transform: translateY(0); }
    to { transform: translateY(64px); }
  }
  @keyframes starsPulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.68; }
  }
  h1, .subtitle, #setup, #game {
    position: relative;
    z-index: 1;
  }
  h1, h2, #turnInfo, .mode-card strong, #setup button, .btn {
    font-family: 'Orbitron', 'Share Tech Mono', monospace;
  }
  h1 {
    color: #dff8ff;
    text-shadow: 0 0 18px rgba(0, 220, 255, 0.35), 0 0 34px rgba(178, 102, 255, 0.22);
    margin: 0 0 6px;
    font-size: clamp(2rem, 3vw, 3rem);
    letter-spacing: -0.03em;
  }
  .subtitle {
    color: rgba(156, 223, 255, 0.88);
    margin-top: 0;
    margin-bottom: 22px;
    font-size: 14px;
    letter-spacing: 0.01em;
  }

  #setup {
    background: linear-gradient(165deg, rgba(10,20,44,0.8), rgba(13,30,58,0.68));
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 28px 30px;
    border-radius: 24px;
    border: 1px solid rgba(0, 230, 255, 0.3);
    box-shadow: 0 0 0 1px rgba(106, 78, 255, 0.3), 0 22px 55px rgba(2, 8, 21, 0.55);
    text-align: center;
    max-width: 520px;
    width: 100%;
    animation: floatCard 4.5s ease-in-out infinite;
  }
  #setup h2 {
    margin: 0 0 18px;
    font-size: 1.75rem;
    letter-spacing: -0.03em;
  }
  #setup label { display:block; margin: 10px 0 6px; font-weight:700; color: var(--muted); }
  #setup select {
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid rgba(0, 214, 255, 0.28);
    font-size: 15px;
    width: 100%;
    background: rgba(7, 19, 41, 0.78);
    color: #d8f4ff;
    box-shadow: inset 0 0 0 1px rgba(90, 158, 255, 0.16);
  }
  .mode-row {
    display: grid;
    gap: 12px;
    margin-top: 16px;
  }
  .mode-card {
    width: 100%;
    padding: 16px 18px;
    border: 1px solid rgba(35, 210, 255, 0.28);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(14, 42, 86, 0.95), rgba(10, 28, 62, 0.92));
    cursor: pointer;
    text-align: left;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    box-shadow: inset 0 0 18px rgba(66, 173, 255, 0.16), 0 10px 24px rgba(3, 14, 40, 0.36);
  }
  button.mode-card {
    margin-top: 0;
    background: linear-gradient(180deg, rgba(14, 42, 86, 0.95), rgba(10, 28, 62, 0.92));
    color: #d8f4ff;
    box-shadow: inset 0 0 18px rgba(66, 173, 255, 0.16), 0 10px 24px rgba(3, 14, 40, 0.36);
  }
  .mode-card:hover {
    transform: translateY(-2px);
    border-color: rgba(106, 214, 255, 0.7);
    box-shadow: 0 0 28px rgba(43, 147, 255, 0.26), 0 16px 30px rgba(2, 14, 35, 0.4);
    background: linear-gradient(180deg, rgba(18, 54, 102, 0.96), rgba(11, 36, 77, 0.94));
  }
  button.mode-card:hover {
    background: linear-gradient(180deg, rgba(18, 54, 102, 0.96), rgba(11, 36, 77, 0.94));
  }
  .mode-card strong {
    display: block;
    font-size: 17px;
    margin-bottom: 5px;
    color: var(--ink);
  }
  .mode-card span {
    color: #8eb8d4;
    font-size: 13px;
    line-height: 1.5;
  }
  #setup button:not(.mode-card), .btn {
    margin-top: 18px;
    padding: 12px 24px;
    background: linear-gradient(180deg, #00eaff, #00a6d8);
    color: #021626;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    box-shadow: 0 0 0 1px rgba(157, 244, 255, 0.45), 0 10px 28px rgba(0, 181, 231, 0.34);
    position: relative;
    overflow: hidden;
  }
  #setup button:not(.mode-card)::before, .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.28), transparent 78%);
    transform: translateX(-130%);
    transition: transform 0.45s ease;
  }
  #setup button:not(.mode-card):hover::before, .btn:hover::before {
    transform: translateX(130%);
  }
  .btn.secondary-btn {
    margin-top: 0;
    background: linear-gradient(180deg, #1e2d52, #15203f);
    color: #bdefff;
    box-shadow: 0 0 0 1px rgba(100, 186, 255, 0.36), 0 10px 20px rgba(2, 14, 35, 0.5);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 12px;
  }
  #setup button:not(.mode-card):hover, .btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.02);
    box-shadow: 0 0 24px rgba(0, 220, 255, 0.35), 0 14px 30px rgba(0, 142, 220, 0.4);
  }
  #setup button:not(.mode-card):active, .btn:active { transform: translateY(0); }

  .player-name-row {
    display:flex;
    gap:10px;
    align-items:center;
    margin-top:10px;
  }
  .player-name-row select.color-select {
    flex: 0 0 140px;
    padding: 10px 12px;
    font-size: 14px;
    border-radius: 12px;
    border: 1px solid rgba(55, 219, 255, 0.33);
    background: rgba(6, 18, 37, 0.8);
    color: #d8f6ff;
  }
  .player-name-row .pin-marker {
    width: 34px;
    height: 34px;
    flex: 0 0 auto;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 10px 18px rgba(16, 24, 40, 0.18);
    border: 2px solid rgba(145, 245, 255, 0.9);
    position: relative;
  }
  .player-name-row .pin-marker::after {
    content: '';
    position: absolute;
    inset: 10px 10px 9px 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.16);
  }
  .player-name-row .pin-marker span {
    transform: rotate(45deg);
    line-height: 1;
    position: relative;
    z-index: 1;
  }
  .player-name-row input[type="text"] {
    flex: 1 1 auto;
    min-width: 0;
    padding: 12px 14px;
    font-size: 15px;
    border-radius: 14px;
    border: 1px solid rgba(39, 199, 255, 0.32);
    outline: none;
    transition: border 0.2s, box-shadow 0.2s, transform 0.2s;
    background: rgba(6, 16, 36, 0.82);
    color: #d9f3ff;
  }
  .player-name-row input[type="text"]:focus {
    border-color: rgba(47, 223, 255, 0.72);
    box-shadow: 0 0 0 4px rgba(47, 223, 255, 0.18);
    transform: translateY(-1px);
  }
  .player-name-row select.color-select:focus {
    outline: none;
    border-color: rgba(47, 223, 255, 0.72);
    box-shadow: 0 0 0 4px rgba(47, 223, 255, 0.18);
  }

  #game {
    display:none;
    width:100%;
    max-width: 1240px;
    flex-direction: column;
    align-items:center;
    gap: 16px;
    padding: 18px;
    border-radius: 30px;
    background: linear-gradient(165deg, rgba(8, 18, 40, 0.72), rgba(11, 12, 35, 0.78) 50%, rgba(16, 28, 56, 0.7));
    border: 1px solid rgba(75, 206, 255, 0.26);
    box-shadow: 0 0 0 1px rgba(167, 94, 255, 0.16), 0 28px 62px rgba(2, 9, 24, 0.58);
    animation: floatCard 5.5s ease-in-out infinite;
    position: relative;
  }
  #game::before,
  #game::after {
    content: '';
    position: absolute;
    width: 56px;
    height: 56px;
    border: 2px solid rgba(255, 87, 87, 0.65);
    background: repeating-linear-gradient(135deg, rgba(255, 214, 79, 0.3) 0 6px, rgba(255, 214, 79, 0.05) 6px 12px);
    z-index: 2;
    pointer-events: none;
  }
  #game::before {
    top: 8px;
    left: 8px;
    clip-path: polygon(0 0, 100% 0, 100% 32%, 32% 32%, 32% 100%, 0 100%);
  }
  #game::after {
    bottom: 8px;
    right: 8px;
    clip-path: polygon(68% 0, 100% 0, 100% 100%, 0 100%, 0 68%, 68% 68%);
  }
  .hud-strip {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 4px;
  }
  .hud-chip {
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #c6eeff;
    border: 1px solid rgba(69, 213, 255, 0.45);
    background: linear-gradient(180deg, rgba(8,24,46,0.86), rgba(12,18,36,0.82));
    box-shadow: inset 0 0 12px rgba(0, 177, 255, 0.18);
  }
  .hud-chip.alert {
    border-color: rgba(255, 91, 174, 0.6);
    color: #ffd2f0;
    box-shadow: inset 0 0 10px rgba(255, 91, 174, 0.2);
  }
  @keyframes floatCard {
    0% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
    100% { transform: translateY(0); }
  }
  .game-main {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    gap: 18px;
    align-items: start;
  }
  #sidePanel {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .legend {
    display:flex; flex-wrap:wrap; gap: 10px 14px; justify-content:center;
    background: linear-gradient(180deg, rgba(10,25,48,0.9), rgba(15,22,42,0.84));
    padding: 12px 16px;
    border-radius: 16px;
    margin-bottom: 2px;
    font-size: 13px;
    border: 1px solid rgba(77, 213, 255, 0.32);
    box-shadow: 0 0 24px rgba(34, 187, 255, 0.2);
  }
  .legend div { display:flex; align-items:center; gap:6px; color: #c4ebff; }
  .swatch { width:14px; height:14px; border-radius:4px; display:inline-block; border:1px solid rgba(169,231,255,0.35); box-shadow: 0 0 8px rgba(126, 213, 255, 0.35);}

  #board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    position: relative;
    background: linear-gradient(165deg, rgba(7,20,42,0.9), rgba(13,27,56,0.82));
    padding: 14px;
    border-radius: 24px;
    width: 100%;
    border: 1px solid rgba(77, 213, 255, 0.22);
    box-shadow: inset 0 0 22px rgba(35, 133, 255, 0.2), 0 24px 52px rgba(0, 6, 18, 0.56);
  }
  #board::before {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 18px;
    pointer-events: none;
    background:
      repeating-linear-gradient(90deg, transparent 0 8.8%, rgba(0, 219, 255, 0.13) 8.8% 9.3%, transparent 9.3% 18.6%),
      repeating-linear-gradient(0deg, transparent 0 18.8%, rgba(147, 90, 255, 0.1) 18.8% 19.2%, transparent 19.2% 38.4%);
    opacity: 0.55;
  }
  .tile {
    position: relative;
    aspect-ratio: 1;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 12px;
    color: #bcdef7;
    box-shadow:
      inset 0 0 0 1px rgba(92, 214, 255, 0.25),
      0 0 14px rgba(19, 104, 169, 0.22);
    overflow: hidden;
  }
  .tile::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(88, 212, 255, 0.13), transparent 46%);
    pointer-events: none;
  }
  .tile.normal {
    background: linear-gradient(180deg, rgba(23, 29, 46, 0.9), rgba(18, 23, 37, 0.92));
    box-shadow: inset 0 0 0 1px rgba(180, 198, 219, 0.26), 0 0 12px rgba(17, 25, 42, 0.35);
  }
  .tile.red { background: rgba(72, 18, 56, 0.82); box-shadow: inset 0 0 0 1px rgba(255, 93, 158, 0.65), 0 0 16px rgba(255, 93, 158, 0.28); color:#ffd9eb; }
  .tile.blue {
    background: linear-gradient(180deg, rgba(10, 57, 98, 0.95), rgba(6, 40, 74, 0.95));
    box-shadow: inset 0 0 0 1px rgba(76, 229, 255, 0.85), 0 0 18px rgba(46, 211, 255, 0.45);
    color:#e9fdff;
  }
  .tile.yellow { background: rgba(61, 51, 17, 0.8); box-shadow: inset 0 0 0 1px rgba(255, 212, 77, 0.6), 0 0 14px rgba(255, 212, 77, 0.26); color:#ffefb0; }
  .tile.green { background: rgba(15, 59, 52, 0.8); box-shadow: inset 0 0 0 1px rgba(64, 240, 178, 0.62), 0 0 15px rgba(64, 240, 178, 0.24); color:#ccfff0; }
  .tile.purple { background: rgba(56, 25, 82, 0.82); box-shadow: inset 0 0 0 1px rgba(179, 125, 255, 0.65), 0 0 16px rgba(179, 125, 255, 0.26); color:#ead8ff; }
  .tile.finish { background: rgba(6, 11, 27, 0.94); box-shadow: inset 0 0 0 1px rgba(239, 247, 255, 0.55), 0 0 16px rgba(196, 226, 255, 0.24); color:#f1fbff; }
  .tile .num {
    position:absolute;
    top:4px;
    left:6px;
    font-size:10px;
    opacity:0.95;
    z-index:1;
    color:#f7fbff;
    text-shadow: 0 0 6px rgba(0,0,0,0.65);
  }

  .tokens { position:absolute; bottom:5px; display:flex; gap:2px; flex-wrap:wrap; justify-content:center; width:100%; z-index:1; }
  .token {
    font-size: 16px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.28));
    transition: transform 0.15s ease;
  }
  .token.pin-token {
    width: 18px;
    height: 18px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: inline-grid;
    place-items: center;
    position: relative;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    box-shadow: 0 4px 8px rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.85);
  }
  .token.pin-token::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
  }
  .token.pin-token span {
    transform: rotate(45deg);
    position: relative;
    z-index: 1;
    line-height: 1;
  }
  .token.hop {
    animation: hopBounce 0.22s ease;
  }
  @keyframes hopBounce {
    0% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-10px) scale(1.15); }
    100% { transform: translateY(0) scale(1); }
  }

  #controls {
    margin-top: 0;
    background: linear-gradient(180deg, rgba(8,24,46,0.9), rgba(10,19,39,0.86));
    padding: 18px 24px 22px;
    border-radius: 24px;
    box-shadow: inset 0 0 0 1px rgba(83, 202, 255, 0.24), 0 18px 42px rgba(2, 8, 22, 0.56);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: none;
    border: 1px solid rgba(83, 202, 255, 0.28);
  }
  #audioRow {
    width: 100%;
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .switch-btn {
    min-width: 96px;
    padding: 8px 12px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 11px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), 0 0 0 1px rgba(110, 201, 255, 0.35), 0 8px 16px rgba(0, 17, 40, 0.5);
  }
  .switch-btn::after {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-left: 8px;
    border-radius: 50%;
    background: #65f7ff;
    box-shadow: 0 0 8px #65f7ff;
    vertical-align: middle;
  }
  #soundBtn.sound-off::after {
    background: #ff6ca8;
    box-shadow: 0 0 8px #ff6ca8;
  }
  #turnInfo {
    font-size: 18px;
    font-weight: 700;
    text-align:center;
    color: #def6ff;
  }
  #turnInfo .color-dot { display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:8px; vertical-align:middle; box-shadow: 0 0 0 3px rgba(255,255,255,0.7); }

  #reactorChamber {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    position: relative;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle, rgba(16, 56, 98, 0.35) 0 44%, rgba(5, 19, 40, 0.92) 65%),
      linear-gradient(180deg, rgba(8,23,45,0.92), rgba(6,14,28,0.98));
    border: 1px solid rgba(89, 220, 255, 0.4);
    box-shadow: inset 0 0 34px rgba(0, 189, 255, 0.24), 0 0 34px rgba(24, 80, 179, 0.26);
    overflow: hidden;
  }
  #reactorChamber::before,
  #reactorChamber::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    inset: 14px;
    border: 1px dashed rgba(137, 219, 255, 0.35);
    animation: spinRing 10s linear infinite;
  }
  #reactorChamber::after {
    inset: 30px;
    border-style: solid;
    border-color: rgba(255, 112, 219, 0.26);
    animation-direction: reverse;
    animation-duration: 7s;
  }
  .plasma-spark {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #73ebff;
    box-shadow: 0 0 10px #73ebff;
    opacity: 0;
    animation: sparkOrbit 1.4s linear infinite;
  }
  .plasma-spark.s2 {
    background: #ff7be8;
    box-shadow: 0 0 10px #ff7be8;
    animation-delay: 0.46s;
  }
  .plasma-spark.s3 {
    background: #7bffb8;
    box-shadow: 0 0 10px #7bffb8;
    animation-delay: 0.92s;
  }
  #dice {
    width: 88px;
    height: 88px;
    background: linear-gradient(160deg, rgba(20, 56, 95, 0.95), rgba(10, 28, 54, 0.97));
    border: 1px solid rgba(121, 224, 255, 0.6);
    clip-path: polygon(50% 0, 92% 24%, 92% 76%, 50% 100%, 8% 76%, 8% 24%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 800;
    margin: 6px 0;
    color: #e8f8ff;
    text-shadow: 0 0 12px rgba(154, 233, 255, 0.55);
    box-shadow: inset 0 0 20px rgba(0, 199, 255, 0.22), 0 0 20px rgba(0, 173, 255, 0.3);
    animation: dieHover 2.8s ease-in-out infinite;
    position: relative;
    z-index: 1;
  }
  #dice::before {
    content: '';
    position: absolute;
    inset: 7px;
    clip-path: polygon(50% 0, 90% 24%, 90% 76%, 50% 100%, 10% 76%, 10% 24%);
    border: 1px solid rgba(180, 239, 255, 0.32);
  }
  #reactorChamber.active #dice {
    animation: dieRoll 0.16s linear infinite;
  }
  #reactorChamber.active .plasma-spark {
    opacity: 1;
  }
  @keyframes spinRing {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes sparkOrbit {
    0% { transform: rotate(0deg) translateX(60px) scale(0.6); opacity: 0; }
    20% { opacity: 1; }
    50% { transform: rotate(180deg) translateX(60px) scale(1); opacity: 1; }
    100% { transform: rotate(360deg) translateX(60px) scale(0.55); opacity: 0; }
  }
  @keyframes dieHover {
    0%, 100% { transform: translateY(0) rotateY(0deg); }
    50% { transform: translateY(-5px) rotateY(8deg); }
  }
  @keyframes dieRoll {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(14deg) scale(1.04); }
    50% { transform: rotate(-12deg) scale(1.06); }
    75% { transform: rotate(10deg) scale(1.03); }
    100% { transform: rotate(0deg) scale(1); }
  }
  .scanner-btn {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #c8f5ff;
    background: linear-gradient(180deg, rgba(12, 39, 73, 0.95), rgba(7, 21, 42, 0.95));
    border: 1px solid rgba(78, 220, 255, 0.52);
    box-shadow: inset 0 0 20px rgba(0, 191, 255, 0.18), 0 0 22px rgba(0, 157, 255, 0.22);
  }
  .scanner-btn::before {
    background: linear-gradient(120deg, transparent 10%, rgba(115, 237, 255, 0.48), transparent 65%);
  }
  .scanner-btn:hover {
    box-shadow: inset 0 0 22px rgba(66, 228, 255, 0.26), 0 0 30px rgba(0, 200, 255, 0.3);
  }
  #log {
    display: none;
  }
  .hidden { display:none !important; }

  #winnerOverlay {
    position: fixed; inset:0; background: rgba(10, 15, 28, 0.72);
    display:flex; align-items:center; justify-content:center; z-index: 10;
    backdrop-filter: blur(10px);
  }
  #winnerBox {
    background: linear-gradient(180deg, rgba(8,24,44,0.95), rgba(10,18,36,0.94));
    padding: 40px 50px;
    border-radius: 26px;
    text-align:center;
    border: 1px solid rgba(86, 203, 255, 0.38);
    box-shadow: 0 28px 70px rgba(0,0,0,0.34);
  }
  #winnerBox h2 { margin-top:0; letter-spacing: -0.03em; }

  #powerPopup {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-30px);
    background: linear-gradient(180deg, rgba(7,22,44,0.96), rgba(17,34,66,0.96));
    color: #fff;
    padding: 14px 26px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 18px 35px rgba(0,0,0,0.34);
    opacity: 0;
    z-index: 50;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    text-align: center;
    max-width: 90%;
    border: 1px solid rgba(255,255,255,0.1);
  }
  #powerPopup.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 760px) {
    .game-main {
      grid-template-columns: 1fr;
    }
    #sidePanel {
      width: 100%;
    }
  }
</style>
</head>
<body>

<div class="color-orb a"></div>
<div class="color-orb b"></div>
<div class="color-orb c"></div>

<h1>🎲 Roll N Ride</h1>
<p class="subtitle">A simple race game — roll, climb, and dodge the colors!</p>

<div id="powerPopup"></div>

<div id="setup">
  <div id="landingScreen">
    <h2>Start Game</h2>
    <div class="mode-row">
      <button class="mode-card" id="computerModeBtn" type="button">
        <strong>Play with computer</strong>
        <span>One player against a computer-controlled opponent.</span>
      </button>
      <button class="mode-card" id="friendsModeBtn" type="button">
        <strong>Play with friends</strong>
        <span>Add player names, then start a local multiplayer game.</span>
      </button>
    </div>
  </div>

  <div id="modeScreen" class="hidden">
    <h2>Game Setup</h2>
    <label for="numPlayers">Number of Players</label>
    <select id="numPlayers">
      <option value="2">2 Players</option>
      <option value="3">3 Players</option>
      <option value="4">4 Players</option>
    </select>
    <div id="nameFields"></div>
    <button id="startBtn">Start Game</button>
  </div>
</div>

<div id="game">
  <div class="hud-strip">
    <span class="hud-chip">System Online</span>
    <span class="hud-chip alert">Sector Grid 07A</span>
  </div>

  <div class="legend">
    <div><span class="swatch" style="background:var(--normal)"></span> Normal</div>
    <div><span class="swatch" style="background:var(--red)"></span> Skip Turn</div>
    <div><span class="swatch" style="background:var(--blue)"></span> Boost +3</div>
    <div><span class="swatch" style="background:var(--yellow)"></span> Swap Places</div>
    <div><span class="swatch" style="background:var(--green)"></span> Slide -2</div>
    <div><span class="swatch" style="background:var(--purple)"></span> Roll Again</div>
    <div><span class="swatch" style="background:var(--finish)"></span> Finish</div>
  </div>

  <div class="game-main">
    <div id="board"></div>

    <div id="sidePanel">
      <div id="controls">
        <div id="audioRow">
          <button class="btn secondary-btn switch-btn" id="backBtn" type="button">New Game</button>
          <button class="btn secondary-btn switch-btn" id="soundBtn" type="button">Audio: On</button>
        </div>
        <div id="turnInfo"></div>
        <div id="reactorChamber">
          <span class="plasma-spark s1"></span>
          <span class="plasma-spark s2"></span>
          <span class="plasma-spark s3"></span>
          <div id="dice">?</div>
        </div>
        <button class="btn scanner-btn" id="rollBtn">Engage Roll</button>
      </div>
    </div>
  </div>
</div>

<script>
const PLAYER_COLOR_OPTIONS = [
  { name: 'Ruby Red', value: '#e03131' },
  { name: 'Ocean Blue', value: '#1971c2' },
  { name: 'Forest Green', value: '#2f9e44' },
  { name: 'Amber Orange', value: '#f08c00' },
  { name: 'Royal Purple', value: '#7b2cbf' },
  { name: 'Teal', value: '#0f766e' }
];
const PLAYER_SOUND_PROFILES = [
  { wave: 'sine', base: 392 },
  { wave: 'triangle', base: 440 },
  { wave: 'square', base: 494 },
  { wave: 'sawtooth', base: 523 }
];
const PLAYER_NAMES_DEFAULT = ['Player 1', 'Player 2', 'Player 3', 'Player 4'];

const TILE_TYPES = ['normal','blue','normal','normal','normal','yellow','yellow','purple','normal','red',
'normal','normal','red','normal','normal','yellow','blue','normal','blue','green',
'normal','green','yellow','normal','normal','purple','normal','normal','normal','green',
'blue','green','yellow','blue','purple','normal','blue','green','blue','green',
'blue','yellow','normal','normal','normal','normal','normal','normal','normal','finish'];

const TOTAL_TILES = TILE_TYPES.length; // 50, indices 0-49

const POWER_INFO = {
  red:    { label: 'RED POWER', icon: '🔴', desc: p => `${p.name} will SKIP their next turn!` },
  blue:   { label: 'BLUE POWER', icon: '🔵', desc: p => `${p.name} BOOSTS forward 3 spaces!` },
  yellow: { label: 'YELLOW POWER', icon: '🟡', desc: (p, extra) => `${p.name} SWAPS places with ${extra}!` },
  green:  { label: 'GREEN POWER', icon: '🟢', desc: p => `${p.name} SLIDES back 2 spaces!` },
  purple: { label: 'PURPLE POWER', icon: '🟣', desc: p => `${p.name} ROLLS AGAIN!` }
};

let players = [];
let currentPlayerIndex = 0;
let gameOver = false;
let playMode = 'friends';
let audioCtx = null;
let soundEnabled = true;
let computerTurnTimer = null;

const landingScreen = document.getElementById('landingScreen');
const modeScreen = document.getElementById('modeScreen');
const numPlayersSelect = document.getElementById('numPlayers');
const nameFields = document.getElementById('nameFields');
const startBtn = document.getElementById('startBtn');
const computerModeBtn = document.getElementById('computerModeBtn');
const friendsModeBtn = document.getElementById('friendsModeBtn');
const setupDiv = document.getElementById('setup');
const gameDiv = document.getElementById('game');
const boardDiv = document.getElementById('board');
const turnInfo = document.getElementById('turnInfo');
const diceDiv = document.getElementById('dice');
const reactorChamber = document.getElementById('reactorChamber');
const rollBtn = document.getElementById('rollBtn');
const backBtn = document.getElementById('backBtn');
const soundBtn = document.getElementById('soundBtn');
const logDiv = document.getElementById('log');
const powerPopup = document.getElementById('powerPopup');

function cancelComputerTurn() {
  if (computerTurnTimer) {
    clearTimeout(computerTurnTimer);
    computerTurnTimer = null;
  }
}

function scheduleComputerTurn(delay = 900) {
  cancelComputerTurn();
  computerTurnTimer = setTimeout(() => {
    computerTurnTimer = null;
    runComputerTurn();
  }, delay);
}

function returnToModeSelection() {
  cancelComputerTurn();
  gameOver = false;
  players = [];
  currentPlayerIndex = 0;
  rollBtn.disabled = false;
  diceDiv.textContent = '?';
  reactorChamber.classList.remove('active');
  if (logDiv) logDiv.innerHTML = '';
  powerPopup.classList.remove('show');

  const winnerOverlay = document.getElementById('winnerOverlay');
  if (winnerOverlay) winnerOverlay.remove();

  gameDiv.style.display = 'none';
  setupDiv.style.display = 'block';
  modeScreen.classList.add('hidden');
  landingScreen.classList.remove('hidden');
}

backBtn.addEventListener('click', returnToModeSelection);

function ensureAudioContext() {
  if (!window.AudioContext && !window.webkitAudioContext) return null;
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

async function unlockAudioFromGesture() {
  const ctx = ensureAudioContext();
  if (!ctx) return false;
  if (ctx.state === 'suspended') {
    try {
      await ctx.resume();
    } catch {
      return false;
    }
  }
  return ctx.state === 'running';
}

function playTone(ctx, frequency, duration, wave, volume, offset = 0) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const startAt = ctx.currentTime + offset;
  const stopAt = startAt + duration;

  osc.type = wave;
  osc.frequency.setValueAtTime(frequency, startAt);

  gain.gain.setValueAtTime(0.0001, startAt);
  gain.gain.exponentialRampToValueAtTime(volume, startAt + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, stopAt);

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startAt);
  osc.stop(stopAt + 0.02);
}

function playPlayerSound(player, type) {
  if (!soundEnabled) return;
  const ctx = ensureAudioContext();
  if (!ctx || !player) return;

  const idx = Math.max(0, players.indexOf(player));
  const profile = PLAYER_SOUND_PROFILES[idx % PLAYER_SOUND_PROFILES.length];
  const base = profile.base;
  const wave = profile.wave;

  if (type === 'turn') {
    playTone(ctx, base, 0.08, wave, 0.12, 0);
    playTone(ctx, base * 1.25, 0.09, wave, 0.11, 0.09);
    return;
  }

  if (type === 'roll') {
    playTone(ctx, base * 1.5, 0.07, wave, 0.14, 0);
    playTone(ctx, base * 1.2, 0.08, wave, 0.12, 0.08);
    return;
  }

  if (type === 'power') {
    playTone(ctx, base * 1.8, 0.12, wave, 0.14, 0);
    playTone(ctx, base * 1.35, 0.12, 'triangle', 0.11, 0.12);
    return;
  }

  if (type === 'win') {
    playTone(ctx, base, 0.12, wave, 0.15, 0);
    playTone(ctx, base * 1.25, 0.12, wave, 0.15, 0.14);
    playTone(ctx, base * 1.5, 0.12, wave, 0.15, 0.28);
    playTone(ctx, base * 2, 0.2, wave, 0.16, 0.42);
  }
}

function playSystemPing() {
  if (!soundEnabled) return;
  const ctx = ensureAudioContext();
  if (!ctx) return;
  playTone(ctx, 660, 0.08, 'triangle', 0.12, 0);
  playTone(ctx, 880, 0.1, 'triangle', 0.11, 0.09);
}

function playDiceRollTick(step) {
  if (!soundEnabled) return;
  const ctx = ensureAudioContext();
  if (!ctx) return;
  const base = 520 + ((step % 5) * 38);
  playTone(ctx, base, 0.03, 'triangle', 0.085, 0);
  playTone(ctx, base * 0.72, 0.022, 'square', 0.07, 0.012);
  if (step % 3 === 0) {
    playTone(ctx, base * 1.35, 0.015, 'sine', 0.05, 0.02);
  }
}

function playDiceLand() {
  if (!soundEnabled) return;
  const ctx = ensureAudioContext();
  if (!ctx) return;
  playTone(ctx, 260, 0.06, 'triangle', 0.14, 0);
  playTone(ctx, 390, 0.03, 'square', 0.075, 0.02);
  playTone(ctx, 195, 0.08, 'sine', 0.11, 0.045);
}

soundBtn.addEventListener('click', async () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? 'Audio: On' : 'Audio: Off';
  soundBtn.classList.toggle('sound-off', !soundEnabled);
  if (soundEnabled) {
    const ok = await unlockAudioFromGesture();
    if (ok) playSystemPing();
  }
});

document.addEventListener('pointerdown', () => {
  unlockAudioFromGesture();
}, { once: true });

function renderNameFields() {
  const n = parseInt(numPlayersSelect.value);
  nameFields.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const defaultColor = PLAYER_COLOR_OPTIONS[i % PLAYER_COLOR_OPTIONS.length].value;
    const row = document.createElement('div');
    row.className = 'player-name-row';
    const colorOptions = PLAYER_COLOR_OPTIONS.map(option => {
      const selected = option.value === defaultColor ? 'selected' : '';
      return `<option value="${option.value}" ${selected}>${option.name}</option>`;
    }).join('');
    row.innerHTML = `
      <select id="pcolor${i}" class="color-select" aria-label="Player ${i + 1} color">${colorOptions}</select>
      <div class="pin-marker" id="ppin${i}" style="background:${defaultColor}" aria-hidden="true"><span>${i + 1}</span></div>
      <input type="text" id="pname${i}" placeholder="${PLAYER_NAMES_DEFAULT[i]}">
    `;
    nameFields.appendChild(row);
    const colorSelect = document.getElementById(`pcolor${i}`);
    const pinMarker = document.getElementById(`ppin${i}`);
    colorSelect.addEventListener('change', () => {
      pinMarker.style.background = colorSelect.value;
    });
  }
}
numPlayersSelect.addEventListener('change', renderNameFields);
renderNameFields();

function openSetup(mode) {
  playMode = mode;
  ensureAudioContext();
  if (mode === 'computer') {
    landingScreen.classList.add('hidden');
    modeScreen.classList.add('hidden');
    numPlayersSelect.value = '2';
    nameFields.innerHTML = '';
    startBtn.click();
  } else {
    landingScreen.classList.add('hidden');
    numPlayersSelect.value = '2';
    modeScreen.classList.remove('hidden');
    renderNameFields();
  }
}

computerModeBtn.addEventListener('click', () => openSetup('computer'));
friendsModeBtn.addEventListener('click', () => openSetup('friends'));

startBtn.addEventListener('click', () => {
  const n = parseInt(numPlayersSelect.value);
  players = [];
  for (let i = 0; i < n; i++) {
    const input = document.getElementById(`pname${i}`);
    const colorInput = document.getElementById(`pcolor${i}`);
    const defaultName = playMode === 'computer' && i === 1 ? 'Computer' : PLAYER_NAMES_DEFAULT[i];
    const name = (input && input.value.trim()) || defaultName;
    const isComputerPlayer = playMode === 'computer' && i === 1;
    const selectedColor = colorInput
      ? colorInput.value
      : PLAYER_COLOR_OPTIONS[i % PLAYER_COLOR_OPTIONS.length].value;
    players.push({
      name,
      color: selectedColor,
      character: '📍',
      position: 0,
      skipNext: false,
      isComputer: isComputerPlayer
    });
  }
  currentPlayerIndex = 0;
  gameOver = false;
  setupDiv.style.display = 'none';
  gameDiv.style.display = 'flex';
  buildBoard();
  updateBoard();
  updateTurnInfo();
  if (logDiv) logDiv.innerHTML = '';
  addLog('Game started! Good luck to all players.');
  playPlayerSound(players[currentPlayerIndex], 'turn');

  if (players[currentPlayerIndex].isComputer) {
    rollBtn.disabled = true;
    scheduleComputerTurn();
  }
});

function buildBoard() {
  boardDiv.innerHTML = '';
  const cols = 10;
  const rows = Math.ceil(TOTAL_TILES / cols);
  let order = [];
  for (let r = 0; r < rows; r++) {
    let rowIndices = [];
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      if (idx < TOTAL_TILES) rowIndices.push(idx);
    }
    if (r % 2 === 1) rowIndices.reverse();
    order.push(...rowIndices);
  }
  order.forEach(idx => {
    const tile = document.createElement('div');
    tile.className = `tile ${TILE_TYPES[idx]}`;
    tile.id = `tile-${idx}`;
    tile.innerHTML = `<span class="num">${idx}</span><div class="tokens" id="tokens-${idx}"></div>`;
    boardDiv.appendChild(tile);
  });
}

function updateBoard(hopPlayer) {
  for (let i = 0; i < TOTAL_TILES; i++) {
    const t = document.getElementById(`tokens-${i}`);
    if (t) t.innerHTML = '';
  }
  players.forEach((p, index) => {
    const container = document.getElementById(`tokens-${p.position}`);
    if (container) {
      const tok = document.createElement('span');
      tok.className = 'token pin-token';
      tok.style.background = p.color;
      tok.innerHTML = `<span>${index + 1}</span>`;
      tok.title = p.name;
      if (hopPlayer === p) tok.classList.add('hop');
      container.appendChild(tok);
    }
  });
}

function updateTurnInfo() {
  if (gameOver) return;
  const p = players[currentPlayerIndex];
  const label = p.isComputer ? `${p.character} ${p.name} (computer)` : `${p.character} ${p.name}`;
  turnInfo.innerHTML = `<span class="color-dot" style="background:${p.color}"></span>${label}'s turn (tile ${p.position})`;
}

function addLog(msg) {
  if (!logDiv) return;
  const div = document.createElement('div');
  div.textContent = msg;
  logDiv.prepend(div);
}

function showPowerPopup(text) {
  powerPopup.textContent = text;
  powerPopup.classList.add('show');
  clearTimeout(showPowerPopup._t);
  showPowerPopup._t = setTimeout(() => {
    powerPopup.classList.remove('show');
  }, 2200);
}

function nextPlayer() {
  currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  while (players[currentPlayerIndex].skipNext) {
    addLog(`${players[currentPlayerIndex].character} ${players[currentPlayerIndex].name} skips their turn!`);
    players[currentPlayerIndex].skipNext = false;
    currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  }
}

async function runComputerTurn() {
  if (gameOver) return;
  if (gameDiv.style.display !== 'flex') return;
  const player = players[currentPlayerIndex];
  if (!player || !player.isComputer) return;
  addLog(`${player.character} ${player.name} is thinking...`);
  await sleep(900);
  const roll = Math.ceil(Math.random() * 6);
  diceDiv.textContent = roll;
  playPlayerSound(player, 'roll');
  await handleMove(player, roll);
}

// Sleep helper
function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

// Move a player step-by-step, one tile at a time, from current position toward target.
// direction: +1 forward, -1 backward
async function stepMove(player, targetPos) {
  const dir = targetPos > player.position ? 1 : (targetPos < player.position ? -1 : 0);
  while (player.position !== targetPos) {
    player.position += dir;
    updateBoard(player);
    await sleep(220);
  }
}

async function applyTileEffect(player) {
  const tileType = TILE_TYPES[player.position];
  let rollAgain = false;

  switch (tileType) {
    case 'red': {
      player.skipNext = true;
      const info = POWER_INFO.red;
      playPlayerSound(player, 'power');
      addLog(`${player.character} ${player.name} landed on RED — will skip next turn!`);
      showPowerPopup(`${info.icon} ${info.label} — ${info.desc(player)}`);
      await sleep(300);
      break;
    }
    case 'blue': {
      const target = Math.min(player.position + 3, TOTAL_TILES - 1);
      const info = POWER_INFO.blue;
      playPlayerSound(player, 'power');
      showPowerPopup(`${info.icon} ${info.label} — ${info.desc(player)}`);
      await stepMove(player, target);
      addLog(`${player.character} ${player.name} landed on BLUE — boosted forward 3 to tile ${player.position}!`);
      await sleep(200);
      break;
    }
    case 'yellow': {
      const others = players.filter(p => p !== player);
      const swapWith = others[Math.floor(Math.random() * others.length)];
      const info = POWER_INFO.yellow;
      playPlayerSound(player, 'power');
      showPowerPopup(`${info.icon} ${info.label} — ${info.desc(player, swapWith.name)}`);
      const temp = player.position;
      player.position = swapWith.position;
      swapWith.position = temp;
      updateBoard(player);
      addLog(`${player.character} ${player.name} landed on YELLOW — swapped places with ${swapWith.character} ${swapWith.name}!`);
      await sleep(300);
      break;
    }
    case 'green': {
      const target = Math.max(player.position - 2, 0);
      const info = POWER_INFO.green;
      playPlayerSound(player, 'power');
      showPowerPopup(`${info.icon} ${info.label} — ${info.desc(player)}`);
      await stepMove(player, target);
      addLog(`${player.character} ${player.name} landed on GREEN — slid back 2 to tile ${player.position}!`);
      await sleep(200);
      break;
    }
    case 'purple': {
      const info = POWER_INFO.purple;
      playPlayerSound(player, 'power');
      addLog(`${player.character} ${player.name} landed on PURPLE — rolls again!`);
      showPowerPopup(`${info.icon} ${info.label} — ${info.desc(player)}`);
      rollAgain = true;
      await sleep(300);
      break;
    }
    case 'finish': {
      addLog(`🏆 ${player.character} ${player.name} reached the finish and WINS!`);
      showWinner(player);
      break;
    }
    default:
      break;
  }
  return rollAgain;
}

function showWinner(player) {
  gameOver = true;
  rollBtn.disabled = true;
  playPlayerSound(player, 'win');
  const overlay = document.createElement('div');
  overlay.id = 'winnerOverlay';
  overlay.innerHTML = `
    <div id="winnerBox">
      <h2 style="color:${player.color}">🏆 ${player.character} ${player.name} Wins!</h2>
      <p>Congratulations on reaching the finish line first.</p>
      <button class="btn" onclick="location.reload()">Play Again</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

rollBtn.addEventListener('click', async () => {
  if (gameOver) return;
  await unlockAudioFromGesture();
  rollBtn.disabled = true;
  reactorChamber.classList.add('active');
  const player = players[currentPlayerIndex];

  let rollCount = 0;
  const rollInterval = setInterval(() => {
    diceDiv.textContent = Math.ceil(Math.random() * 6);
    rollCount++;
    playDiceRollTick(rollCount);
    if (rollCount > 8) {
      clearInterval(rollInterval);
      const roll = Math.ceil(Math.random() * 6);
      diceDiv.textContent = roll;
      setTimeout(() => {
        reactorChamber.classList.remove('active');
      }, 220);
      playDiceLand();
      playPlayerSound(player, 'roll');
      handleMove(player, roll);
    }
  }, 60);
});

async function handleMove(player, roll) {
  const target = Math.min(player.position + roll, TOTAL_TILES - 1);
  addLog(`${player.character} ${player.name} rolled a ${roll}.`);

  // Step-by-step hop from current tile to target tile, one tile at a time
  await stepMove(player, target);
  updateTurnInfo();

  if (player.position === TOTAL_TILES - 1 && TILE_TYPES[player.position] === 'finish') {
    await applyTileEffect(player);
    return;
  }

  const rollAgain = await applyTileEffect(player);
  updateBoard();
  updateTurnInfo();

  if (gameOver) return;

  if (rollAgain) {
    rollBtn.disabled = false;
    if (players[currentPlayerIndex].isComputer) {
      rollBtn.disabled = true;
      scheduleComputerTurn();
    }
    return;
  }

  nextPlayer();
  updateTurnInfo();
  if (gameOver) return;
  playPlayerSound(players[currentPlayerIndex], 'turn');
  if (players[currentPlayerIndex].isComputer) {
    rollBtn.disabled = true;
    scheduleComputerTurn();
  } else {
    rollBtn.disabled = false;
  }
}
</script>
